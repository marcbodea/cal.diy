name: Full-featured image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: full-featured-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable build database
        run: >-
          docker run -d --name build-db -p 5432:5432
          -e POSTGRES_USER=build -e POSTGRES_PASSWORD=build
          -e POSTGRES_DB=calcom postgres:18.4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          network: host
          allow: network.host
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cal-full-featured:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://build:build@127.0.0.1:5432/calcom
            NEXT_PUBLIC_WEBAPP_URL=https://cal.glizzyhq.com
            CALCOM_TELEMETRY_DISABLED=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cal-full-featured@${{ steps.image.outputs.digest }}
        run: echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
